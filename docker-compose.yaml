services:
  backup:
    build: .
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:-${MONGO_URL:?}}
      MONGO_URL: ${MONGO_URL:-}
      MONGO_DB: ${MONGO_DB:-}
      BACKUP_DIR: /backups
      BACKUP_PREFIX: ${BACKUP_PREFIX:-mongodb}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      RUN_ON_START: ${RUN_ON_START:-true}
      TZ: ${TZ:-UTC}
    volumes:
      - /media/ashish/External1/db_backup_daily:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "require('fs').accessSync('/usr/local/bin/mongodump')"]
      interval: 30s
      timeout: 5s
      retries: 3
